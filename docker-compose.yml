services:
  backend:
    build: .
    container_name: medicare-backend
    ports:
      - "4000:4000"
    volumes:
      - medical_data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/medical.db
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped

volumes:
  medical_data:
    driver: local